{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply a saved theme before the page paints; otherwise default to light. -->
<script>
  (function () {
    var root = document.documentElement;
    var key = 'fatima-site-theme';

    function readTheme() {
      try {
        var saved = localStorage.getItem(key);
        return saved === 'dark' ? 'dark' : 'light';
      } catch (_) {
        return 'light';
      }
    }

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#171518' : '#ffffff');

      var button = document.getElementById('theme-toggle');
      if (button) {
        var next = theme === 'dark' ? 'light' : 'dark';
        button.setAttribute('aria-label', 'Switch to ' + next + ' mode');
        button.setAttribute('title', 'Switch to ' + next + ' mode');
        button.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
      }
    }

    window.toggleSiteTheme = function () {
      var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, next); } catch (_) {}
      applyTheme(next);
    };

    applyTheme(readTheme());
    document.addEventListener('DOMContentLoaded', function () {
      applyTheme(root.getAttribute('data-theme') || readTheme());
    });
  })();
</script>

<!-- Site-specific typography, layout, and light/dark palette. -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/site.css"/>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Favicons -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
